name: Build Wine Fix

on:
  push:
    branches: [ wine-fix ]
  pull_request:
    branches: [ wine-fix ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET Framework
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore Razor.sln

    - name: Build Debug (skipping C++ projects)
      run: |
        msbuild UltimaSDK/Ultima.csproj /p:Configuration=Debug /p:Platform=x86
        msbuild FastColoredTextBox/FastColoredTextBox.csproj /p:Configuration=Debug /p:Platform=AnyCPU
        msbuild Razor/Razor.csproj /p:Configuration=Debug /p:Platform=x86
      continue-on-error: false

    - name: Upload Razor artifacts
      uses: actions/upload-artifact@v4
      with:
        name: RazorEnhanced-WineFix
        path: |
          bin/Win32/Debug/RazorEnhanced.exe
          bin/Win32/Debug/*.dll
          bin/Win32/Debug/*.pdb
        if-no-files-found: warn
